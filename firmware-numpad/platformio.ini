; =====================================================================
;  ExtraKeyboard MK1 — PlatformIO yapılandırması
;  Kaynak: docs/00-CEKIRDEK-SPEC.md (tek doğruluk kaynağı)
;
;  Kart : ESP32-S3-DevKitC-1 (ESP32-S3-WROOM-1, N16R8)
;         16 MB Quad SPI flash + 8 MB Octal SPI PSRAM
;
;  !!! EN KRİTİK AYAR !!!
;  ARDUINO_USB_MODE=0  -> USB-OTG (TinyUSB) yığını devrede kalır.
;                         HID + CDC composite cihaz ANCAK böyle çalışır.
;                         Bu değer 1 yapılırsa TinyUSB devre dışı kalır ve
;                         USB HID (F13..F22 / ses tuşları) HİÇ ÇALIŞMAZ.
;  ARDUINO_USB_CDC_ON_BOOT=1 -> `Serial` nesnesi native USB CDC portuna
;                         bağlanır; PC uygulaması bu porttan konuşur.
; =====================================================================

[platformio]
default_envs = extrakeyboard
src_dir = src

[env:extrakeyboard]
platform  = espressif32 @ ^6.5.0
board     = esp32-s3-devkitc-1
framework = arduino

; ------------------------------------------------------------------
;  N16R8 modülü için bellek ayarları
;  qio_opi = Quad I/O flash + Octal SPI PSRAM  (WROOM-1 N16R8'in tipi)
; ------------------------------------------------------------------
board_build.mcu               = esp32s3
board_build.f_cpu             = 240000000L
; --- BU BIRIM: numpad 6F0568 (MAC 3c:0f:02:6f:05:68) -----------------
; esptool flash_id (2026-09-17): PSRAM 2MB (AP_3v3) = QUAD, flash 8MB,
; eFuse quad, Manufacturer 68 (Boya), Device 4017.
; memory_type/partition bu donanima UYGUNDUR (Quad PSRAM -> qio_qspi).
; DIKKAT 1: qio_opi bu kartta BOOT DONGUSU yapar (PSRAM Quad, Octal degil).
; DIKKAT 2: FLASH MODU DIO + 40MHz SART. Asagidaki qio/80m yalnizca DERLEME
;   icindir (hazir bootloader ELF'i dio_40m olarak YOK). qio/80m ile YAZILIRSA
;   kart acilmaz — olculdu: mode:QIO -> load:0x3fce3808 -> "ets_loader.c 78"
;   -> rst:0x7 TG0WDT dongusu. Sebep Boya (Mfr 68) flash cipinin QIO/80MHz'de
;   ROM tarafindan guvenilir okunamamasi; E74610'da da AYNISI yasandi.
; YUKLEME BAYRAKLARI (sart): --flash_mode dio --flash_freq 40m --flash_size 8MB
;   veya: tools/yukle-kutusuz.py --proje firmware-numpad \
;           --flash-mode dio --flash-freq 40m --flash-size 8MB
board_build.f_flash           = 80000000L
board_build.flash_mode        = qio
board_build.arduino.memory_type = qio_qspi
board_build.partitions        = default_8MB.csv
board_upload.flash_size       = 8MB
board_upload.maximum_size     = 8388608

; ------------------------------------------------------------------
;  Yükleme ve seri izleme
;  monitor_dtr = 1  -> izleyici DTR'yi yükseltir, böylece cihaz
;                      "uygulama bağlı" saysın ve HID yedek moduna düşmesin.
;  monitor_rts = 0  -> DTR düşerken RTS yüksek kalırsa çekirdek cihazı
;                      bootloader'a atar; RTS'i hep düşük tutuyoruz.
; ------------------------------------------------------------------
upload_speed  = 921600
monitor_speed = 115200
monitor_dtr   = 1
monitor_rts   = 0
monitor_filters = direct

; ------------------------------------------------------------------
;  Derleme bayrakları
; ------------------------------------------------------------------
; USB kimliği DERLEME bayrağı olmak ZORUNDA: ARDUINO_USB_CDC_ON_BOOT=1
; ile TinyUSB, setup() çağrılmadan önce başlar; main.cpp'deki runtime
; USB.VID()/PID() çağrıları bu yüzden yetişemez (kart varsayılan
; 0x303A:0x1001 kimliğiyle numaralanır ve uygulama VID/PID eşleşmesi
; kuramaz). Değerler docs/00-CEKIRDEK-SPEC.md bölüm 4 ile birebirdir.
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=0
    -D USB_VID=0x303A
    -D USB_PID=0x82E1
    -D USB_MANUFACTURER="\"BlueDevelopment\""
    -D USB_PRODUCT="\"ExtraKeyboard MK1\""

; ------------------------------------------------------------------
;  Kütüphaneler
; ------------------------------------------------------------------
lib_deps =
; (Duz LED surumunde NeoPixel gerekmiyor; gecmis uyumlulugu icin listede birakildi)
    adafruit/Adafruit NeoPixel @ ^1.12.0
