; =====================================================================
;  EC11 enkoder BAGIMSIZ TEST programi — ExtraKeyboard MK1
;
;  Ana firmware'den tamamen ayridir; ana projeye dokunmaz.
;  Kart ayarlari firmware/platformio.ini ile ayni (N16R8, qio_opi).
;
;  BILEREK USB bayragi yok: `Serial` = UART0 cikisi, yani karttaki
;  "UART" etiketli USB-C port. Test bu porttan hem yuklenir hem izlenir.
;  (TinyUSB karmasasi olmadan en guvenilir test yolu.)
;
;  Kullanim:
;     cd tools/enkoder-test
;     pio run -t upload        # "UART" portuna takili olmali
;     pio device monitor
; =====================================================================

[platformio]
default_envs = enkoder_test
src_dir = src

[env:enkoder_test]
platform  = espressif32 @ ^6.5.0
board     = esp32-s3-devkitc-1
framework = arduino

board_build.mcu                 = esp32s3
board_build.f_cpu               = 240000000L
board_build.f_flash             = 80000000L
board_build.flash_mode          = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB

upload_speed  = 921600
monitor_speed = 115200
monitor_dtr   = 0
monitor_rts   = 0

build_flags =
    -D CORE_DEBUG_LEVEL=0

; --- Ayni test, cikti YERLESIK USB ("USB" etiketli port / usbmodem) ---
;  Serial = donanimsal USB-Serial-JTAG CDC'si. Tek kabloyla hem flash
;  hem monitor "USB" konnektorunde. UART koprusu hic gerekmez.
[env:enkoder_test_usb]
extends = env:enkoder_test
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
