; =====================================================================
;  ExtraKeyboard MK1 — PlatformIO yapılandırması
;  Kaynak: docs/00-CEKIRDEK-SPEC.md (tek doğruluk kaynağı)
;
;  Kart : ESP32-S3-DevKitC-1 (ESP32-S3-WROOM-1, N16R8)
;         16 MB Quad SPI flash + 8 MB Octal SPI PSRAM
;
;  !!! EN KRİTİK AYAR !!!
;  ARDUINO_USB_MODE=0  -> USB-OTG (TinyUSB) yığını devrede kalır.
;                         HID + CDC composite cihaz ANCAK böyle çalışır.
;                         Bu değer 1 yapılırsa TinyUSB devre dışı kalır ve
;                         USB HID (F13..F22 / ses tuşları) HİÇ ÇALIŞMAZ.
;  ARDUINO_USB_CDC_ON_BOOT=1 -> `Serial` nesnesi native USB CDC portuna
;                         bağlanır; PC uygulaması bu porttan konuşur.
; =====================================================================

[platformio]
default_envs = quad, e74610
src_dir = src

; Ortak ayarlar — tüm birim ortamları bunu devralır (birime özgü
; bellek/tuş ayarları dosyanın SONUNDAKİ [env:...] bölümlerindedir).
[env]
platform  = espressif32 @ ^6.5.0
board     = esp32-s3-devkitc-1
framework = arduino

; ------------------------------------------------------------------
;  N16R8 modülü için bellek ayarları
;  qio_opi = Quad I/O flash + Octal SPI PSRAM  (WROOM-1 N16R8'in tipi)
; ------------------------------------------------------------------
board_build.mcu               = esp32s3
board_build.f_cpu             = 240000000L
; f_flash asagida (flash modu blogunda) 40MHz olarak tanimlidir — burada
; ikinci bir tanim BIRAKMA, cakisir.
; !!! BU AYARLAR BİRİME GÖRE DEĞİŞİR — EVRENSEL DEĞİLDİR !!!
; Kartlar karışık donanım: yanlış seçim BOOT DÖNGÜSÜ yapar (kart hiç açılmaz,
; log'da rst:0x7 TG0WDT_SYS_RST tekrar eder). `esptool flash_id` ile kontrol et:
;
;   "Embedded PSRAM 8MB (AP_3v3)" + 16MB flash  -> N16R8  (Octal PSRAM)
;       memory_type = qio_opi , default_16MB.csv , 16MB
;       ORNEK BIRIM: E74610 (a0:85:e3:e7:46:10) -> [env:e74610]
;
;   "Embedded PSRAM 2MB" (Quad PSRAM)
;       memory_type = qio_qspi , default_8MB.csv , 8MB
;       ORNEK BIRIMLER: 6F0B98, 9A2408 -> [env:quad]  (numpad ayri proje)
;
; memory_type degisince bootloader.bin ve partitions.bin de degisir ->
; TAM FLASH sart (0x0, 0x8000, 0xe000, 0x10000); sadece app yazmak YETMEZ.
; --- FLASH MODU: DIO (QIO DEĞİL) — 2026-09-17'de deneyle bulundu -------
; E74610'un flash cipi Boya (esptool "Manufacturer: 68", Device 4018/16MB).
; QIO + 80MHz ile ROM, bootloader segmentlerini flash'tan DOGRU OKUYAMIYOR:
;   load:0x3fce3808,len:0x4bc
;   ets_loader.c 78            <- burada takilir, sonra rst:0x7 TG0WDT dongusu
; Kart HIC acilmaz (sadece "USB JTAG/serial debug unit" olarak gorunur).
; DIO + 40MHz ile sorunsuz aciliyor. Ikisi birlikte degistirildi; asil etken
; buyuk olasilikla DIO (Boya cipleri QIO'da sorunludur). Klavye icin 40MHz'in
; hiz kaybi onemsiz, bu yuzden guvenli tarafta kaliniyor.
; DERLEME qio/80m kalir (hazir bootloader ELF'leri yalnizca dio_80m, opi_80m,
; qio_80m, qio_120m olarak gelir; dio_40m YOKTUR ve secilirse derleme kirilir).
; E74610'da CALISAN kombinasyon = qio_80m bootloader KODU + baslikta DIO/40MHz.
; Basligi esptool yazarken degistirir, bu yuzden YUKLERKEN SU BAYRAKLAR SART:
;     --flash_mode dio --flash_freq 40m --flash_size 8MB
; Bunlar olmadan (duz `pio run -t upload` dahil) kart ACILMAZ.
board_build.flash_mode        = qio
board_build.f_flash           = 80000000L
; memory_type / partitions / flash_size BİRİME GÖREDİR -> dosya sonundaki
; [env:quad] ve [env:e74610] bölümlerine bakın. Burada TANIMLAMAYIN.

; ------------------------------------------------------------------
;  Yükleme ve seri izleme
;  monitor_dtr = 1  -> izleyici DTR'yi yükseltir, böylece cihaz
;                      "uygulama bağlı" saysın ve HID yedek moduna düşmesin.
;  monitor_rts = 0  -> DTR düşerken RTS yüksek kalırsa çekirdek cihazı
;                      bootloader'a atar; RTS'i hep düşük tutuyoruz.
; ------------------------------------------------------------------
upload_speed  = 921600
monitor_speed = 115200
monitor_dtr   = 1
monitor_rts   = 0
monitor_filters = direct

; ------------------------------------------------------------------
;  Derleme bayrakları
; ------------------------------------------------------------------
; USB kimliği DERLEME bayrağı olmak ZORUNDA: ARDUINO_USB_CDC_ON_BOOT=1
; ile TinyUSB, setup() çağrılmadan önce başlar; main.cpp'deki runtime
; USB.VID()/PID() çağrıları bu yüzden yetişemez (kart varsayılan
; 0x303A:0x1001 kimliğiyle numaralanır ve uygulama VID/PID eşleşmesi
; kuramaz). Değerler docs/00-CEKIRDEK-SPEC.md bölüm 4 ile birebirdir.
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=0
    -D USB_VID=0x303A
    -D USB_PID=0x82E1
    -D USB_MANUFACTURER="\"BlueDevelopment\""
    -D USB_PRODUCT="\"ExtraKeyboard MK1\""

; ------------------------------------------------------------------
;  Kütüphaneler
; ------------------------------------------------------------------
lib_deps =
; (Duz LED surumunde NeoPixel gerekmiyor; gecmis uyumlulugu icin listede birakildi)
    adafruit/Adafruit NeoPixel @ ^1.12.0

; =====================================================================
;  BİRİM ORTAMLARI (2026-09-29)
;  Kartlar AYNI donanım DEĞİL. Eskiden her birim değişiminde bu dosya ve
;  keys.cpp ELLE düzenleniyordu; yanlış ayar kartı BOOT DÖNGÜSÜNE sokuyordu
;  (2026-09-17). Artık her birim kendi ortamıyla derlenir ve çıktılar ayrı
;  klasörlere gider (.pio/build/<ortam>/) -> yanlış derlemeyi yanlış karta
;  yazmak mümkün değil. tools/yukle-kutusuz.py kartı USB seri numarasından
;  tanır, doğru ortamı derleyip yükler.
;  YENİ BİRİM: esptool flash_id ile oku -> uygun ortamı seç (ya da yeni ortam
;  aç) -> tools/yukle-kutusuz.py içindeki BIRIMLER tablosuna ekle.
; =====================================================================

; 2MB QUAD PSRAM + 8MB flash, üst sıra ORİJİNAL — 6F0B98, 9A2408
[env:quad]
board_build.arduino.memory_type = qio_qspi
board_build.partitions        = default_8MB.csv
board_upload.flash_size       = 8MB
board_upload.maximum_size     = 8388608

; N16R8: 8MB OCTAL PSRAM + 16MB flash, üst sıra TAKASLI (9<->12, 10<->11) — E74610
[env:e74610]
board_build.arduino.memory_type = qio_opi
board_build.partitions        = default_16MB.csv
board_upload.flash_size       = 16MB
board_upload.maximum_size     = 16777216
build_flags =
    ${env.build_flags}
    -D EK_KEYMAP_SWAPPED
